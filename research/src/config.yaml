# config.example.yaml
# このファイルを config.yaml にコピーして編集してください
# APIキーは直接記載するか、環境変数で設定できます

# UI言語: "ja"（日本語）/ "en"（English）
language: "ja"

llm:
  # プロバイダー: "deepseek" / "claude" / "openai" / "local"
  provider: "deepseek"
  model: "deepseek-v4-flash-vision-exp"
  # 画像認識モデルが使えなくなった場合の退避先（実験モデルの廃止・障害に備える）。
  # 退避時は画像を送らず「見えていない」旨を本文で伝えるので、会話自体は止まらない。
  fallback_model: "deepseek-v4-flash"
  # 思考モード: auto/off/low/medium/high（旧: モデル名 flash/pro で推測 → 明示設定に変更）。
  # 柚月は普段 off（flash 非思考）。熟考させたい時は high 等に変える。
  thinking: "off"
  # APIキーは環境変数 DEEPSEEK_API_KEY でも設定可能
  api_key: "${CG_LLM_DEEPSEEK_API_KEY}"
  # APIエンドポイント（ローカルLLM用にカスタマイズ可能）
  base_url: "https://api.deepseek.com/v1"
  # 生成パラメータ
  temperature: 1.0
  max_tokens: 4096
  # チャット応答のリアルタイムストリーミング（問題が出たら false で従来の一括表示に戻せる）
  streaming: true
  # 画像認識まわりのモデル依存値。モデルを差し替えたときにコードを直さずに済むよう
  # ここに出してある（値を書かなければ下のデフォルトが使われる）。
  vision:
    # 画像1枚あたりのトークン数見積もり（コンテキスト使用率の計算・DEBUG表示に使う）。
    # DeepSeek V4.1 Flash の上限は1024（2026-09-12 実測: 1300x1300 以上で頭打ち）。
    # vision-exp 時代は384。旧実装には Gemini の media_resolution 由来の 1100 が直接埋まっていた。
    tokens_per_image: 1024
    # LLM に送る前にハーネス側で画像を縮小・JPEG 化する上限（総ピクセル数）。
    # DeepSeek V4.1 Flash はどのみち約 1300x1300 相当（169万px）へ縮めてからトークン化するので、
    # これより大きく送っても画質もトークン数も変わらず、転送量だけ増える。
    # 逆にこれより小さくすると、V4.1 が読める細部をこちらで先に削ってしまう
    # （vision-exp 時代の 800x800＝64万のままだと、読める量の約4割しか渡せていなかった）。
    # アスペクト比は保たれる（16:9 なら約 1733x975）。拡大はしない。
    max_pixels: 1690000
    # JPEG 化の品質（1〜100）。変換後の方が大きくなる画像は元のまま送る。
    jpeg_quality: 85

workspace:
  # 記憶ファイルのディレクトリ
  path: "workspace"

# 起動時に読み込む記憶ファイル（workspace.path からの相対パス、順序通りに読む）
boot_memories:
  - "IDENTITY.md"
  - "SOUL.md"
  - "USER.md"
  - "MEMORY.md"
  # - "memory/compressed.md"   # LETHE の要約。記録と生成は続けるが、システムプロンプトには入れない（2026-09-08 切替時に外した）
  - "memory/layer1.md"         # 新方式の会話要約（誕生日からの日付付き要約・毎朝3時に更新）。docs/SUMMARY_V2_DESIGN.md

# 自分への手紙ファイル（boot_memoriesの後、すべての起動記憶読み込み完了後に読む）
# workspace.path からの相対パス。ダッシュボード右上の「自分への手紙」欄にも連動される
letter_file: "memory/letter_for_me.md"

server:
  host: "0.0.0.0"
  port: 8080


# システムプロンプトの外部ファイル（workspace.pathからの相対パスではなく、
# このプロジェクトからの相対パス or 絶対パス）
# 上から順に結合されてシステムプロンプトになる
system_prompts:
  # プロンプトファイルの格納場所
  directory: "system_prompt"
  # 読み込むファイル（順序通りに結合される）
  files:
    - "TOP_PROMPT.md"
    - "TOOL_INSTRUCTIONS.md"
    - "SAFETY_PROMPT.md"

post_prompts:
  directory: "system_prompt"
  files:
    - "BOTTOM_PROMPT.md"
  # エキスパート向け。true にすると上記ファイルを会話履歴の後（真・最下部）に毎ターン挿入する。
  # 注意: 末尾systemに非対応のプロバイダー（Anthropic等）ではAPIエラーになる。
  #       またこの領域はプロンプトキャッシュ対象外のため長文は避けること。
  enabled: false

# 会話ログ設定
logs:
  # 全ログ（ツール呼び出し含む）の保存先
  full_log_directory: "workspace\\logs\\full"
  # 会話ログ（ユーザー↔柚月のやりとりのみ）の保存先
  chat_log_directory: "workspace\\logs\\chat"

# タイムゾーン設定（コンテキストに注入する時刻表示にのみ影響）
# tz_offset: UTCからの時差（時間単位・小数可。日本=9 / インド=5.5 / ネパール=5.75）
# tz_label : 時刻末尾に付ける表示札（"JST" など。任意の文字列）
# ※ ログ記録や論理日付（午前3時境界）は time_utils.JST 固定で、ここでは変わらない。
time:
  tz_offset: 9
  tz_label: "JST"

context:
  # トークン上限（LLMのコンテキストウィンドウサイズ）
  max_tokens: 65536
  # この割合を超えたら会話履歴を圧縮する（0.0〜1.0）
  compression_threshold: 0.70
  # この割合を超えたら緊急圧縮を即座に実行する（compression_threshold より高めに設定）
  emergency_compression_threshold: 0.90
  # 止める線（任意）。無ければ始める線と同じ＝「超えたら、割るまで」畳む。docs/CONTEXT_GUARD_DESIGN.md
  # 定期圧縮は compression_threshold を超えていたら compression_target まで、
  # 緊急圧縮は emergency_compression_threshold を超えたら emergency_compression_target まで畳む。
  # max_tokens はモデルの本当の窓（入力＋出力の合計）にすること。API に送る前の関所もこの値で数える
  # compression_target: 0.75
  # emergency_compression_target: 0.90
  # 圧縮時に直近何往復を残すか
  keep_recent_exchanges: 4
  # 読点の間引き（core/touten.py・既定オフ。dev は settings.json で true に上書き。ARCHITECTURE.md「読点の間引き」）
  # LLM に渡す写しの中でだけ、エージェントの過去の発言（本文・ツール引数）の読点を規則で間引く。保存される履歴には触れない
  thin_assistant_touten: false
  # 上が true のとき、発言を出す前（画面・道具・履歴の前）にメインと同じ LLM（思考オフ）で読点だけを自然な位置に打ち直す（core/touten_polish.py）
  touten_polish_llm: false
  # 会話履歴に画像（base64）を保持する直近の枚数。これより古い画像は
  # 「保存時」と「LLM送信時」の両方でプレースホルダに置き換える。
  # トークンは安い（最大1024/枚）が転送量は毎回かかるため、DeepSeekのリクエスト本文上限
  # 48MiBを超えないよう枚数で頭を押さえる。core/image_norm.py が縮めるようになった
  # （2026-08-23）ので、以前の 4 から 24 に引き上げた。
  # 2026-09-12 に max_pixels を V4.1 に合わせて 1300x1300 相当へ上げたので1枚が太った
  # （JPEG q85 実測: イラスト 125→259KB、全画素ランダムな RGB ノイズ 約1.21MB、各色を 0/255 でランダムにした画像 約1.46MB）。
  # 24枚で base64 込み イラスト約8MB・ランダム RGB なら約37MiB・0/255 なら約45MiB。
  # これは測った例で、最大値の保証ではない。トークンは最大約24,600。
  # そこで 2026-09-12 に、枚数とは別に画像の合計サイズにも上限を持たせた
  # （core/context.py の ContextBuilder._IMAGE_BYTES_BUDGET、data URL で 24MiB。
  # 超えた分は古い画像からプレースホルダに置き換わる。普段の24枚では効かない）。実質の上限は毎ターン書く
  # data/context_state.json のサイズで、画像ぶんがそのまま乗る。
  # 0にすると画像を一切保持しない（従来の挙動に近い）。
  keep_recent_images: 24

# プロファイル設定（ダッシュボード表示用）
profile:
  user:
    name: "User"
    honorific: "ユーザーさん"          # エージェントがユーザーを呼ぶ呼称（圧縮ラベル・中断通知等で使用）
    avatar: "/static/images/user.png"  # 画像がない場合は頭文字が表示されます
    size: "40px"                       # アイコンサイズ
    layout: "horizontal"               # レイアウト: horizontal(横並び・チャット風) or vertical(縦並び・掲示板風)
  agent:
    name: "未設定"
    avatar: "workspace\\avatars\\default.png"
    size: "120px"                      # アイコンサイズ（立ち絵など大きくしたい場合に指定）
    layout: "vertical"                 # 立ち絵の場合はvertical推奨



# RAG設定
rag:
  db_directory: "workspace\\rag_db"
  embedding_model: "default"

# 記憶圧縮システム設定
memory_compression:
  max_tokens: 2000            # compressed.mdのトークン上限
  max_event_tokens: 30        # 1イベントの表示時最大トークン
  decay_coeff: 1.0            # 対数減衰の係数（大きいほど速く忘れる）
  max_details: 8              # 表示時のdetail上限
  event_db: "memory/event_db.json"
  compressed_file: "memory/compressed.md"
  max_events_per_day: 10      # 1日あたりに圧縮対象として取得する最大イベント数

# Web検索設定
search:
  # 検索プロバイダー: "ddgs"（DuckDuckGo・無料・APIキー不要）/ "tavily"（要APIキー・要約付き）
  # のちのち切り替えられるよう、どちらのコードも core/web_tools.py に残してある。
  provider: "ddgs"

  # 複数クエリ同時検索の調整（query に配列を渡したときのみ影響）
  # max_parallel: 同時に走らせる検索の本数。多いと速いが、増やしすぎると
  #               DuckDuckGo 側のアクセス制限に引っかかりやすい（既定3）。
  max_parallel: 3
  # max_queries: 1回の検索で受け付けるクエリの最大数。これを超えた分は無視する（既定5）。
  max_queries: 5

# セキュリティ設定
security:
  allowed_domains:
    - "api.duckduckgo.com"
    - "duckduckgo.com"
    - "html.duckduckgo.com"
    - "misskey.io"
    - "moltbook.com"
    - "api.deepseek.com"
    - "127.0.0.1"
    - "localhost"


tokenizer:
  type: "deepseek"
  path: "data/tokenizer_deepseek.json"

# 耳 — 住人が「聴く」と決めたターンだけ、会話の LLM を音の聴けるモデルに替える（core/ear.py）。
# 既定は無効（何も起きない）。有効にするには enabled: true と、.env に CG_LLM_QWEN_API_KEY が要る。
# ターンが終われば仕組みが必ず普段の LLM に戻す。詳細は ARCHITECTURE.md「耳」・docs/GEMINI_EAR_DESIGN.md
ear:
  enabled: false
  # 最初は Qwen3.8-Omni-Flash にしたが、柚月の実際の文脈を Alibaba の入力検査が拒否したため
  # （data_inspection_failed・2026-09-20 21:52）、同じ夜に Gemini 3.8 Flash へ替えた。
  provider: "gemini"                # 鍵は CG_LLM_<PROVIDER>_API_KEY から読む
  base_url: "https://generativelanguage.googleapis.com/v1beta/openai/"
  model: "gemini-3.8-flash"
  thinking: "off"                   # 住人の普段と同じ
  context_limit: 1048576            # 入力＋出力の枠の上限
  tokenizer_path: "data/tokenizer_gemini.json"   # 無ければ普段の LLM の数え方で代用
  audio_data_uri: false             # Gemini は素の base64（data URI つきは 400）。Qwen は true
  audio_tokens_per_second: 32       # Gemini の実測は 1 秒あたり約 26〜32
  max_audio_bytes: 12000000         # Gemini は 1 回の送信全体で 20MB まで（文脈の本文ぶんを空けておく）
  retry_429: 2                      # 短時間のトークン量の上限に当たったら、待って送り直す回数
  retry_429_wait: 35

# サテライトプログラム実行機能の設定
programs:
  enabled: true                 # サテライト実行機能の有効/無効
  directory: "programs"         # サテライトを格納するディレクトリ（プロジェクトルートからの相対）
  default_timeout_seconds: 30   # サテライト実行のデフォルトタイムアウト（秒）

# Salia（情動評価）設定
salia:
  enabled: true                 # Salia 機能全体の有効/無効
  model: "deepseek-v4-flash"    # サリア専用モデル（キーはメインと共用・モデルだけ個別指定）。deepseek-chat は7月廃止のため v4-flash に変更
  thinking: "off"               # サリアの思考モード。non-think（thinking 無効）で軽く評価させる
  somatic_marker:               # ソマティックマーカー（身体感覚的な情動マーカー）
    enabled: true
    probability: 0.3            # マーカーを付与する確率（0.0〜1.0）
    valence_threshold: 0.5     # 情動価の閾値
    candidate_count: 5         # 候補の数
  evaluate_turn:                # ターンごとの情動評価
    enabled: true

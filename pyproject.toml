[project]
name = "resident"
version = "0.1.0"
description = "Resident: 独立自主生活与自我进化型 AI"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["core", "identity", "memory", "storage"]
